services:
  - type: web
    name: liam-whatsapp-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Render's liveness check. It returns 200 as soon as the HTTP server is up,
    # even while WhatsApp is still restoring or waiting for a pairing code.
    # Monitor /ready separately (UptimeRobot) to alert when Liam is not linked.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- Runtime paths -----------------------------------------------------
      - key: LIAM_DATA_DIR
        value: /data
      - key: LIAM_DB
        value: /data/liam_memory.db

      # --- WhatsApp ----------------------------------------------------------
      - key: LIAM_BOT_PHONE
        value: "447881161023"
      # Stable secret for the /qr and /pair pages. Render generates and keeps it
      # across deploys; the pairing URL is printed in the deploy logs.
      - key: LIAM_PAIR_TOKEN
        generateValue: true
      # Baileys log level: silent (default), error, warn, info, debug or trace.
      # Set it in the dashboard (e.g. to debug a connection) without render.yaml
      # resetting it back on the next deploy.
      - key: LIAM_WA_LOG
        sync: false

      # --- Supabase persistence (required for a usable free deployment) ------
      # Set these in the Render dashboard. The bucket is created automatically
      # if it does not exist.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: liam-session
      - key: LIAM_SUPABASE_TIMEOUT_MS
        value: "120000"
      # Backups are a safety net, not a heartbeat. The writer skips the tar/gzip
      # and vacuum entirely when nothing changed, so a longer interval costs
      # almost nothing on an idle Liam and stops the CPU spikes that can starve
      # the WhatsApp socket.
      - key: LIAM_BACKUP_INTERVAL_MS
        value: "1800000"

      # --- Model providers ---------------------------------------------------
      # Comma-separated lists are accepted for the rotating key pools.
      - key: MOON_KEYS
        sync: false
      - key: UNO_KEYS
        sync: false
      - key: AGNES_KEY
        sync: false
      - key: HCN_KEY
        sync: false

      # --- Optional capabilities --------------------------------------------
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: INSTABOX_API_KEY
        sync: false
      # Optional: leave unset and Liam discovers (or creates) the free machine.
      - key: INSTABOX_MACHINE_ID
        sync: false
      # Email (IMAP). Gmail requires an App Password, not the account password,
      # and "IMAP access" turned on in Gmail settings.
      - key: LIAM_EMAIL_HOST
        value: imap.gmail.com
      - key: LIAM_EMAIL_PORT
        value: "993"
      - key: LIAM_EMAIL_USER
        value: liamagent4q@gmail.com
      - key: LIAM_EMAIL_PASSWORD
        sync: false
      - key: LIAM_EMAIL_FOLDER
        value: INBOX

      # --- Group and DM policy ----------------------------------------------
      # Dashboard-managed (sync: false) so a deploy never silently changes who
      # can reach Liam. LIAM_DM_OPEN=1 opens DMs to everyone Liam has seen in a
      # group; 0 (default) keeps DMs to owners/admins. LIAM_DM_ALLOWLIST adds
      # extra numbers (comma-separated) on top of that.
      - key: LIAM_DM_OPEN
        sync: false
      - key: LIAM_DM_ALLOWLIST
        sync: false

      # --- Behaviour --------------------------------------------------------
      # Bridge waits a little longer than the agent's per-turn budget so a heavy
      # browser turn is not cut off mid-work, but a stuck turn still ends.
      - key: LIAM_ASK_TIMEOUT_MS
        value: "180000"
      - key: LIAM_TURN_BUDGET
        value: "120"
      - key: LIAM_BROWSER_TIMEOUT
        value: "90"
      - key: LIAM_SCREENSHOT_TIMEOUT
        value: "75"
      - key: LIAM_GROUP_PERMISSION_MS
        value: "10800000"
      - key: LIAM_TOOL_APPROVAL_MS
        value: "600000"
      - key: LIAM_INIT_TIMEOUT_MS
        value: "300000"

      # --- Staying linked ----------------------------------------------------
      # WhatsApp drops the socket (428) when this container cannot answer its
      # keep-alives - which is what a memory spike or a stalled event loop looks
      # like from WhatsApp's side. Recycle the WhatsApp socket (keeping the
      # login) before the 512 MiB limit is hit, and ping a little more often so
      # one missed beat is not fatal.
      - key: LIAM_MEM_LIMIT_MB
        value: "400"
      - key: LIAM_WA_KEEPALIVE_MS
        value: "25000"
      # Run headless Chromium on the InstaBox VM instead of this container, so
      # browser tools never starve the WhatsApp connection. Falls back to the
      # local browser automatically if the VM is unreachable.
      - key: LIAM_VPS_BROWSER
        value: "1"
