name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required for the secret scan below.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint (undefined names and unused imports)
        run: python -m ruff check .
      - name: Compile check
        run: python -m compileall -q .
      - name: Secret scan (working tree)
        run: python scripts/scan_secrets.py
      # gitleaks scans every commit, not just the current tree. Its allowlist
      # uses paths anchored at the repository root (the in-tree scanner's
      # substring allowlist is broader and is tracked separately).
      - name: Secret scan (full git history)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG_TOML: |
            title = "Liam history secret scan"
            [extend]
            useDefault = true
            [[allowlists]]
            description = "Placeholders in root-anchored example, docs and test paths only"
            paths = [
              '''^\.env\.example$''',
              '''^README\.md$''',
              '''^docs/''',
              '''^tests/''',
              '''^scripts/scan_secrets\.py$''',
            ]
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Note
        run: echo "Baileys is pure JavaScript; no browser download is needed in CI"
      - name: Syntax check
        run: npm run check && node --check scripts/seed_supabase.js && node --check scripts/verify_deployment.js
      - name: Node tests (bridge, sync, InstaBox, deployment verifier)
        run: npm test
      - name: Audit (fail only on critical)
        run: npm audit --omit=dev --audit-level=critical

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build --pull -t liam:ci .
      - name: Smoke-check the image
        run: |
          docker run --rm liam:ci node -e "const b=require('@whiskeysockets/baileys');if(typeof b.default!=='function'){console.error('missing makeWASocket');process.exit(1)}console.log('baileys ok:',require('@whiskeysockets/baileys/package.json').version)"
          docker run --rm liam:ci /opt/venv/bin/python -c "import agent, playwright; print('python agent import ok')"
          docker run --rm liam:ci /opt/venv/bin/python -c "import os,glob; p=os.environ['PLAYWRIGHT_BROWSERS_PATH']; found=glob.glob(p+'/chromium-*/*/chrome'); print('playwright Chromium:', found); assert found"
