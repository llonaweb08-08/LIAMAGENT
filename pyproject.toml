[project]
name = "liam-whatsapp-agent"
version = "0.1.0"
description = "Liam: a WhatsApp-linked AI agent bridge"
requires-python = ">=3.10"
dependencies = [
    "requests==2.34.2",
    "playwright==1.64.1",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "liam_session",
    "node_modules",
]

[tool.ruff.lint]
select = ["F"]
