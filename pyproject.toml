[project]
name = "liam-whatsapp-agent"
version = "0.1.0"
description = "Liam: a WhatsApp-linked AI agent bridge"
requires-python = ">=3.12"
dependencies = [
    "requests==2.34.2",
    "playwright==1.65.2",
    "edge-tts==7.3.1",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "liam_session",
    "node_modules",
]

[tool.ruff.lint]
select = ["E", "W", "F", "B"]
